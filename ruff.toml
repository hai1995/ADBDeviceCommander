# ADB 设备指令台 —— ruff 静态检查配置\n#\n# 定位：CI 的「防劣化」门禁。只启用**当前存量已为 0** 的规则：老代码照常跑，\n# 任何新改动一旦引入同类问题就立刻拦住。不追求一次性把历史代码刷干净。\n#\n# 为什么不开全规则：全量扫描本仓库会报 1800+ 项，其中八成是 `%` 格式化\n# （UP031 600+）、blind-except（BLE001 385）、类型标注（ANN 1812）这类风格项。\n# 一次性启用只会让 CI 长期飘红，门禁随即被无视，比没有门禁更糟。\n#\n# 存量盘点（按批消化，清完一批就把规则加进 select、删掉对应 ignore 行）：\n#   UP031 667（已自动转换 488 处安全的、余 179 处 ruff 保守标 unsafe 待手写，\n#               见下方「部分推进」）/ BLE001 385 / S110 166 / PLW1510 47\n# 上面这些目前都不启用，改动集中在 perf_service.py / prefs.py / record.py\n# 等大文件，适合单独开 PR 处理，不混进日常改动。\n#   SIM115 2 —— 经逐处核查均为「有意的跨作用域句柄持有」（见下方「故意不启用」），\n#               不计入存量待办。\n#\n# 已消化的批次（规则已进 select，存量归零）：\n#   2026-11-11 第一批：B007 / B009 / B023 / B905 —— bugbear 仅剩的 4 条\n#   2026-11-11 第二批：RUF100（无效 noqa）/ RUF012（可变类属性未标 ClassVar）\n#   2026-11-11 第三批：UP009（冗余 utf-8 声明，52 处纯机械删除）\n#   2026-11-13 第四批：UP006 / UP015 / UP017 / UP022 / UP045 / C402 / COM812 /\n#               PIE790 / PIE810 / RET502 / RET504 / SIM103 —— 标准库现代化 +\n#               冗余清理（≈50 处，safe + 已逐处复核的 unsafe）。SIM102 故意\n#               未启用：剩 2 处是「嵌套 if 中间夹解释性注释」的刻意拆解，合并\n#               会丢失注释的上下文归属，可读性优先，留待人工判断。\n#   2026-11-13 第五批：I001 / RUF059 / ISC004 —— import 块排序（controller.py\n#               整文件豁免，保住刻意编排的聚合 import）+ 未使用解包变量改名 `_` +\n#               集合内隐式字符串拼接合并（共 42 处：30 处安全自动修复、\n#               12 处 ruff 标 unsafe，逐处人工复核后改，字节级等价）。\n#\n# 仍未启用（留给后续批次）：BLE001 385 / S110 166（blind except / try-except-pass，\n# 绝大多数是有意的兜底，逐个改要人判断，误改会把静默降级变成真 bug）、\n# PLW1510 47（subprocess 未加 check，多是有意的「失败不致命」调用）。\n#\n# 部分推进（已做安全部分，未清零故暂未进 select）：\n#   UP031 667 —— 第 7 批用 `ruff --fix --unsafe-fixes` 自动转换了 488 处安全的\n#               `%`→f-string（py_compile + ruff 双重验证通过，字节级等价）；剩 179\n#               处 ruff 保守标 unsafe（多为单参数 `% (x)`、隐式拼接混合、个别\n#               `.format()` 残留），需逐处手写清零后才能把 UP031 加进 select 真正\n#               启用门禁。暂不进 select，避免「存量未清零就开规则」让 CI 飘红。\n#\n# 故意不启用（不是存量待办，而是经核查确属有意写法，启用反而破坏行为）：\n#   SIM102（剩 2 处嵌套 if 中间夹解释性注释，合并会丢注释上下文归属 —— 见第四批）\n#   SIM115 2（open 未用 with）：logcat_service.py:917 抓取文件句柄「首会话开、\n#               重连会话复用同一句柄」必须活到整个抓取循环结束；scrcpy_service\n#               .py:255 的句柄赋给子进程 stdout 重定向、需后台存活到子进程退出。\n#               两处都是有意的跨作用域长期持有句柄，包 with 会提前关闭句柄 →\n#               丢数据 / 子进程写已关闭文件崩溃，故不启用。\n#\n# tests/ 排除：测试里大量夹具导入顺序是刻意写法，且 CI 的 pyflakes 门禁已覆盖\n# tests 的 F 规则。生产代码 ruff 全量覆盖。（SIM115 整体不启用，见上方说明。）\n\ntarget-version = "py311"\nexclude = [\n    "tests",\n    "frontend/vendor",\n    ".uploads",\n]\n\n[lint]\nselect = [\n    "E9",     # 语法错误 / 无法解析的源码\n    "F",      # pyflakes 等价：未用导入、未定义名、重复定义\n    "A",      # 内置名被遮蔽（id / list / type ...）\n    "ASYNC",  # 异步反模式\n    "B",      # bugbear：可变默认参数、raise from、无用断言等\n    "ERA",    # 注释掉的死代码\n    "FLY",    # 该用 join 却手写字符串累加\n    "G",      # logging 格式化误用\n    "LOG",    # logging 调用反模式\n    "PGH",    # 无规则编码 / 泛化的 noqa、type: ignore\n    "RUF100", # 无效的 noqa 指令（指向未启用规则 / 已不需要）\n    "RUF012", # 可变类属性未标 ClassVar\n    "UP009",  # 冗余的 utf-8 编码声明（Python 3 默认即 UTF-8）\n    "UP006",  # typing.List/Dict -> 内置 list/dict（PEP585）\n    "UP015",  # open() 冗余的 "r" 模式（默认即读）\n    "UP017",  # datetime.utcnow/utcfromtimestamp -> timezone.utc\n    "UP022",  # stdout=PIPE,stderr=PIPE -> capture_output=True\n    "UP045",  # Optional[X] -> X | None（PEP604）\n    "C402",   # dict(...) 生成器 -> 字面量 / 直接构造\n    "COM812", # 缺失尾逗号（与 Black 风格对齐）\n    "PIE790", # 无意义的 pass/... 占位语句\n    "PIE810", # a.startswith(x) or a.startswith(y) -> a.startswith((x, y))\n    "RET502", # 隐式返回（函数体内 return 与 fall-through 混用）\n    "RET504", # 不必要的「赋值后立刻返回」中间变量\n    "SIM103", # 不必要的 bool 包装（return x and y 等）\n    "TID",    # 相对导入、被禁导入\n    "I001",   # import 块排序 / 格式化（controller.py 整文件豁免）\n    "RUF059", # 解包出的变量未使用（-> 改为 _）\n    "ISC004", # 集合 / 元组字面量里多余的隐式字符串拼接\n]\n\n# 按文件豁免：\n#   tools/package.py 必须在 sys.path.insert 之后 import 同目录的 bump_version\n#   （否则 import 不到），E402 在这里是有意为之；\n#   backend/controller.py 的 import 块是刻意编排的「聚合 import」（把 backend.\n#   controllers 各 mixin 的公共符号集中导出供界面层少写一层前缀），I001 一排序\n#   就会把这套编排打散、纯风格 churn，故整文件豁免 I001。\n[lint.per-file-ignores]\n"tools/package.py" = ["E402"]\n"backend/controller.py" = ["I001"]\n