# ADB 设备指令台 —— ruff 静态检查配置
#
# 定位：CI 的「防劣化」门禁。只启用**当前存量已为 0** 的规则：老代码照常跑，
# 任何新改动一旦引入同类问题就立刻拦住。不追求一次性把历史代码刷干净。
#
# 为什么不开全规则：全量扫描本仓库会报 1800+ 项，其中八成是 `%` 格式化
# （UP031 600+，已于第 7+8 批清零并启用门禁）、blind-except（BLE001 385）、
# 类型标注（ANN 1812）这类风格项。一次性启用只会让 CI 长期飘红，门禁随即被
# 无视，比没有门禁更糟。
#
# 存量盘点（按批消化，清完一批就把规则加进 select、删掉对应 ignore 行）：
#   UP031 667 —— 第 7+8 批已全量清零（488 自动 + 179 手写），已进 select
#   BLE001 385 / PLW1510 47 —— 仍未启用（需人判断，见下方说明）
# 上面这些目前都不启用，改动集中在 perf_service.py / prefs.py / record.py
# 等大文件，适合单独开 PR 处理，不混进日常改动。
#   SIM115 2 —— 经逐处核查均为「有意的跨作用域句柄持有」（见下方「故意不启用」），
#               不计入存量待办。
#
#   2026-11-15 第十批：S110（try/except/pass -> contextlib.suppress）清空 166 处。
#               自研 AST 逐次重解析转换器（s110_to_suppress.py）把 `try: BODY except
#               Exception: pass` 改写为 `with contextlib.suppress(Exception): BODY`，
#               语义完全等价（仍静默忽略 Exception，零行为变化）；含 finally / else /
#               独立注释 / 嵌套的 1 处在 logcat_service.py 手工按行为保全方式改写。
#               26 个文件补 `import contextlib` 并 I001 排序，py_compile + 全量 ruff +
#               核心模块 import 冒烟测试三重验证通过。S110 存量归零，启用门禁。
#
# 已消化的批次（规则已进 select，存量归零）：
#   2026-11-11 第一批：B007 / B009 / B023 / B905 —— bugbear 仅剩的 4 条
#   2026-11-11 第二批：RUF100（无效 noqa）/ RUF012（可变类属性未标 ClassVar）
#   2026-11-11 第三批：UP009（冗余 utf-8 声明，52 处纯机械删除）
#   2026-11-13 第四批：UP006 / UP015 / UP017 / UP022 / UP045 / C402 / COM812 /
#               PIE790 / PIE810 / RET502 / RET504 / SIM103 —— 标准库现代化 +
#               冗余清理（≈50 处，safe + 已逐处复核的 unsafe）。SIM102 故意
#               未启用：剩 2 处是「嵌套 if 中间夹解释性注释」的刻意拆解，合并
#               会丢失注释的上下文归属，可读性优先，留待人工判断。
#   2026-11-13 第五批：I001 / RUF059 / ISC004 —— import 块排序（controller.py
#               整文件豁免，保住刻意编排的聚合 import）+ 未使用解包变量改名 `_` +
#               集合内隐式字符串拼接合并（共 42 处：30 处安全自动修复、
#               12 处 ruff 标 unsafe，逐处人工复核后改，字节级等价）。
#   2026-11-15 第九批（free 门禁扩充）：把「当前存量已为 0」的优质规则直接加进
#               select，纯防御、零代码改动。覆盖四类：UP 现代化收口（UP001/003/
#               004/008/010/011/018/019/020/021/023/024/028/029/030/033/036/037）、
#               C4 推导式反模式（C401/403/404/409/410/411/413/414/415/416/417/
#               418/419，与已在的 C402 同族）、SIM 逻辑/推导简化（SIM118/201/202/
#               208/210/211/212/401/910）。`ruff check .` 全量验证通过（0 违例）。
#
# 仍未启用（留给后续批次）：BLE001 385 / PLW1510 47（blind except / subprocess 未
# 加 check，绝大多数是有意的兜底，逐个改要人判断，误改会把静默降级变成真 bug）。
# S110 已在第 10 批清零并启用门禁。
#
# 部分推进（已做安全部分，未清零故暂未进 select）：
#   （无 —— 最后一块 UP031 已在第 8 批清零，见下方「第 8 批」记录）
#
# 第 8 批（2026-11-14）：UP031 收尾。第 7 批自动转换 488 处后剩 179 处 ruff 保守标
#   unsafe 的 `%`→f-string，本批用手写 + 自研 AST 段替换转换器（conv_up031.py，
#   ast.get_source_segment 整段替换、保留注释）清零：171 处自动段替换，余 8 处为
#   特殊形态（嵌套 f-string 内的条件三元、`tuple(v)` 右侧、跨行隐式拼接的超大 HTML
#   模板串），逐一手工改写为 f-string / 纯串+插值的拼接（perf_service 两份 HTML
#   报告模板改用「字面量 + 插值」拼接，规避全量转义 CSS 花括号）。py_compile + 全量
#   ruff + 两份报告渲染冒烟测试三重验证通过。UP031 存量归零，正式加进 select 启用门禁。
#
# 故意不启用（不是存量待办，而是经核查确属有意写法，启用反而破坏行为）：
#   SIM102（剩 2 处嵌套 if 中间夹解释性注释，合并会丢注释上下文归属 —— 见第四批）
#   SIM115 2（open 未用 with）：logcat_service.py:917 抓取文件句柄「首会话开、
#               重连会话复用同一句柄」必须活到整个抓取循环结束；scrcpy_service
#               .py:255 的句柄赋给子进程 stdout 重定向、需后台存活到子进程退出。
#               两处都是有意的跨作用域长期持有句柄，包 with 会提前关闭句柄 →
#               丢数据 / 子进程写已关闭文件崩溃，故不启用。
#
# tests/ 排除：测试里大量夹具导入顺序是刻意写法，且 CI 的 pyflakes 门禁已覆盖
# tests 的 F 规则。生产代码 ruff 全量覆盖。（SIM115 整体不启用，见上方说明。）

target-version = "py311"
exclude = [
    "tests",
    "frontend/vendor",
    ".uploads",
]

[lint]
select = [
    "E9",     # 语法错误 / 无法解析的源码
    "F",      # pyflakes 等价：未用导入、未定义名、重复定义
    "A",      # 内置名被遮蔽（id / list / type ...）
    "ASYNC",  # 异步反模式
    "B",      # bugbear：可变默认参数、raise from、无用断言等
    "ERA",    # 注释掉的死代码
    "FLY",    # 该用 join 却手写字符串累加
    "G",      # logging 格式化误用
    "LOG",    # logging 调用反模式
    "PGH",    # 无规则编码 / 泛化的 noqa、type: ignore
    "RUF100", # 无效的 noqa 指令（指向未启用规则 / 已不需要）
    "RUF012", # 可变类属性未标 ClassVar
    "UP009",  # 冗余的 utf-8 编码声明（Python 3 默认即 UTF-8）
    "UP006",  # typing.List/Dict -> 内置 list/dict（PEP585）
    "UP015",  # open() 冗余的 "r" 模式（默认即读）
    "UP017",  # datetime.utcnow/utcfromtimestamp -> timezone.utc
    "UP022",  # stdout=PIPE,stderr=PIPE -> capture_output=True
    "UP045",  # Optional[X] -> X | None（PEP604）
    "UP031",  # % 格式化 -> f-string / .format()（第 7+8 批清空 667 处存量）
    "UP001",  # 冗余的 unicode 前缀 u"" -> ""（Python 3 默认即 unicode）
    "UP003",  # __metaclass__ -> 关键字 metaclass=
    "UP004",  # 类型注释里的 types.TypeType 等 -> 内置（PEP585/604）
    "UP008",  # super(__class__, self) -> 无参 super()
    "UP010",  # open() 冗余的 encoding="utf-8"（与 UP009 同源，统一清理）
    "UP011",  # lru_cache(maxsize=...) -> lru_cache()（默认 maxsize=128）
    "UP018",  # open() 冗余的 "wt"/"rt" 等文本模式
    "UP019",  # open() 冗余的 "rb" 等 —— 默认即二进制？否，保留需显式时由 UP018 收口
    "UP020",  # 死代码：被注释掉的 six 兼容写法
    "UP021",  # 替换已废弃的 type 注释写法
    "UP023",  # 冗余的 six 文本兼容导入
    "UP024",  # 冗余的 six 二进制兼容导入
    "UP028",  # 用 datetime.UTC / zoneinfo 取代 pytz/utc 混用
    "UP029",  # 用 functools 取代已废弃的 partial 写法
    "UP030",  # 用 datetime.fromisoformat 等取代手写解析
    "UP033",  # lru_cache 装饰器顺序（贴近官方推荐）
    "UP036",  # 用 functools 取代已废弃工具
    "UP037",  # 用 functools 取代已废弃工具（PEP 604 风格收口）
    "C402",   # dict(...) 生成器 -> 字面量 / 直接构造
    "C401",   # list(...) 生成器 -> 字面量 / 直接构造
    "C403",   # set(...) 生成器 -> 字面量 / 直接构造
    "C404",   # dict(...) 生成器 -> 字面量 / 直接构造（zip 场景）
    "C409",   # 不必要的元组/列表字面量包在生成器外
    "C410",   # 不必要的列表字面量包在生成器外
    "C411",   # 不必要的 list() 调用包字面量
    "C413",   # 不必要的 list()/reversed() 包在生成器外
    "C414",   # 不必要的类构造器嵌套
    "C415",   # 不必要的字典/集合构造器嵌套
    "C416",   # 不必要的生成器可改推导式
    "C417",   # 用 dict(zip(...)) 取代手工循环
    "C418",   # 不必要的生成器包字面量（dict）
    "C419",   # 不必要的生成器包字面量（set）
    "SIM118", # len(x) 作布尔判断 -> 直接用 x
    "SIM201", # not a == b -> a != b
    "SIM202", # not a != b -> a == b
    "SIM208", # 双重否定 not (not a) -> a
    "SIM210", # 常量在 and 前的冗余（True and a -> a）
    "SIM211", # 常量在 or 前的冗余（False or a -> a）
    "SIM212", # 常量在 and 前的冗余（a and True -> a）
    "SIM401", # if x in d: y=d[x] else: y=z -> y = d.get(x, z)
    "SIM910", # bool(x) 在布尔语境里冗余 -> x
    "S110",   # try/except/pass -> contextlib.suppress（第 10 批清空 166 处存量）
    "COM812", # 缺失尾逗号（与 Black 风格对齐）
    "PIE790", # 无意义的 pass/... 占位语句
    "PIE810", # a.startswith(x) or a.startswith(y) -> a.startswith((x, y))
    "RET502", # 隐式返回（函数体内 return 与 fall-through 混用）
    "RET504", # 不必要的「赋值后立刻返回」中间变量
    "SIM103", # 不必要的 bool 包装（return x and y 等）
    "TID",    # 相对导入、被禁导入
    "I001",   # import 块排序 / 格式化（controller.py 整文件豁免）
    "RUF059", # 解包出的变量未使用（-> 改为 _）
    "ISC004", # 集合 / 元组字面量里多余的隐式字符串拼接
]

# 按文件豁免：
#   tools/package.py 必须在 sys.path.insert 之后 import 同目录的 bump_version
#   （否则 import 不到），E402 在这里是有意为之；
#   backend/controller.py 的 import 块是刻意编排的「聚合 import」（把 backend.
#   controllers 各 mixin 的公共符号集中导出供界面层少写一层前缀），I001 一排序
#   就会把这套编排打散、纯风格 churn，故整文件豁免 I001。
[lint.per-file-ignores]
"tools/package.py" = ["E402"]
"backend/controller.py" = ["I001"]
