# ADB 设备指令台 —— 懒人发版流水线
#
# 痛点
# ----
# 之前发版要：本地跑 `tools/bump_version.py --apply` 改 VERSION → 提交 →
# 打 `v<版本>` tag → push --tags，GitHub 才触发 build.yml 去发 Release。
# 这套「先改文件再打 tag」的手动链路，忘了哪一步都不出包。
#
# 本工作流把整条链路收进 CI：你只需要在 GitHub 的
#   Actions → release → Run workflow
# 点一下，剩下的全自动：
#   1) 递增 VERSION（或你显式指定的版本号）并写回源码；
#   2) 提交 + 打 tag + 推送到 main（tag 名 = v + VERSION，与源码一致）；
#   3) 跑全量单测（Python + 前端），红了就停下、不发版；
#   4) Windows 上 build.py --package --zip，把 zip / sha256sums.txt / latest.json
#      自动发布为 Release（程序内更新检查就读取这个 latest.json）。
#
# 可选输入
#   version  显式版本号（格式 YYYY.MMDD.HHMM）。留空 = 自动递增（同 bump_version.py）。
#   notes    Release 更新说明（单行）。留空 = 自动汇总自上次发版以来的提交。
#
# 注意
# ----
# * 推送用仓库内置 GITHUB_TOKEN，按 GitHub 规则：由它触发/产生的 push 不会
#   再次触发其它工作流，所以不会和 build.yml 形成递归或重复发版。
# * 需要 default branch（main）允许 GITHUB_TOKEN 直接推送；若仓库开了
#   「必须通过 PR 才能合入 main」的分支保护，本工作流会推送失败 —— 那种情况
#   仍走「PR 合入 + 打 tag」的老路。
# * 版本号一致性由 bump_version.py 保证（它写文件后直接用于构建），
#   因此本工作流不再单独做「tag 与 VERSION 比对」这一步。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "显式版本号（留空则自动递增，格式 YYYY.MMDD.HHMM）"
        required: false
        default: ""
      notes:
        description: "Release 更新说明（单行；留空则自动汇总自上次发版以来的提交）"
        required: false
        default: ""

# 发版需要写权限（提交、打 tag、建 Release）
permissions:
  contents: write

# 同一仓库一次只跑一个发版，避免连点产生交错的版本号
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1) 递增版本号 + 提交 + 打 tag + 推送；并顺手把 Release 说明生成好
  # ---------------------------------------------------------------------------
  prepare:
    name: 递增版本号 + 打 tag + 生成说明
    # 固定到 ubuntu-24.04（理由见 build.yml 同一处注释）：发版流程最不该
    # 被「镜像换代」这种与代码无关的变更打断。
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 递增版本号（写入源码）
        id: bump
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            python tools/bump_version.py --set "${{ github.event.inputs.version }}"
          else
            python tools/bump_version.py --apply
          fi
          VER=$(python - <<'PY'
          import re, pathlib
          t = pathlib.Path("core/constants.py").read_text(encoding="utf-8")
          print(re.search(r'^VERSION = "([^"]+)"', t, re.M).group(1))
          PY
          )
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "- 新版本号：$VER" >> "$GITHUB_STEP_SUMMARY"

      - name: 提交并推送 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.bump.outputs.tag }}"
          for f in core/constants.py main.py README.md; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            # 版本号没变：典型场景是同一分钟里连点两次「Run workflow」——
            # 版本号格式是 YYYY.MMDD.HHMM，同一分钟必然算出同一个值。
            # 旧实现只打一行「跳过提交」就往下走，可后面两个 job 都是按
            # tag 检出代码的（ref: ${{ needs.prepare.outputs.tag }}），而 tag
            # 压根没创建 —— 它们在 checkout 阶段报 "reference is not a tree"，
            # 跟真正的原因（版本号撞车）毫无关系，只能靠猜。
            # 现在分两种情形：tag 已存在且**正好指向当前提交**才复用（同分钟
            # 重跑，源码一致）；否则明确失败，把原因和做法写清楚。
            HEAD_SHA=$(git rev-parse HEAD)
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1 \
               && [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$HEAD_SHA" ]; then
              echo "版本号与本 tag 一致，复用已存在的 $TAG（源码内容相同）"
            else
              echo "::error::版本号 ${{ steps.bump.outputs.version }} 与当前源码一致，未产生新提交，也没有指向当前提交的 tag。"
              echo "::error::最常见的原因是同一分钟内触发了两次发版（版本号精确到分钟）。请等下一分钟再触发，或显式填写一个更大的 version。"
              exit 1
            fi
          else
            git commit -m "release: v${{ steps.bump.outputs.version }}"
            git tag "$TAG"
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git push origin "$BRANCH" --tags
          fi

      - name: 生成 Release 说明
        env:
          CUSTOM_NOTES: ${{ github.event.inputs.notes }}
        run: |
          mkdir -p notes
          if [ -n "$CUSTOM_NOTES" ]; then
            python3 - <<'PY' > notes/release-notes.md
          import os
          print(os.environ["CUSTOM_NOTES"])
          PY
          else
            # 排除「release: v…」这条提交本身：它就是本次发版产生的，
            # 写进更新说明只会让弹窗第一行变成「- release: v2026.1031.1256」，
            # 用户看不出这一版到底改了什么。
            PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log "${PREV}..HEAD" --pretty=format:'- %s' \
                --invert-grep --grep='^release: v' > notes/release-notes.md
            else
              git log --pretty=format:'- %s' -n 30 \
                --invert-grep --grep='^release: v' > notes/release-notes.md
            fi
            # 自上次发版以来只有发版提交（或全被过滤掉）时别交一份空说明：
            # gh release create 拿到空文件会建出一个没有正文的 Release。
            if [ ! -s notes/release-notes.md ]; then
              echo "- 本次为版本发布，自上一版以来没有额外的功能或修复变更。" \
                > notes/release-notes.md
            fi
          fi
          echo "--- 说明预览 ---"
          cat notes/release-notes.md

      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: notes/release-notes.md

  # ---------------------------------------------------------------------------
  # 2) 全量单测：先拦住明显坏掉的构建（红 = 不发版）
  # ---------------------------------------------------------------------------
  test:
    name: 测试（Python 3.11 + 前端 jsdom）
    runs-on: ubuntu-24.04
    needs: prepare
    # 同 prepare：固定镜像版本，避免发版当天踩到 Ubuntu 26 迁移。
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyflakes

      - name: 静态检查（pyflakes）
        # 与 build.yml 同一道门禁（backend core tools tests）：发版前先拦住
        # 未用导入 / 未定义变量，避免把脏代码打进正式包。
        run: python -m pyflakes backend core tools tests

      - name: Python 单测
        run: python -m pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 前端依赖（jsdom）
        working-directory: tests/frontend
        run: npm install --no-audit --no-fund

      - name: 前端单测
        working-directory: tests/frontend
        run: node run-all.cjs

  # ---------------------------------------------------------------------------
  # 3) Windows 构建 + 发 Release（含 latest.json 静态更新源）
  # ---------------------------------------------------------------------------
  windows:
    name: 打包 + 发版（Windows x64）
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 构建（exe + 分发 zip + 源码 zip）
        run: python build.py --package --zip

      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter *.zip | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content -Path dist/sha256sums.txt -Encoding utf8
          $lines

      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: dist-notes

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $tag = "${{ needs.prepare.outputs.tag }}"
          $assets = @(
            "dist/ADBDeviceCommander_v${ver}_win64.zip",
            "dist/ADBDeviceCommander_v${ver}.zip",
            "dist/sha256sums.txt"
          )
          foreach ($a in $assets) {
            if (-not (Test-Path $a)) { throw "缺少附件：$a" }
          }

          # 该 tag 已经有 Release 时不能再 create（gh 会报 already exists），
          # 而「重跑一次修更新说明 / 补附件」是很实际的需求（上一版的说明写错、
          # 或构建产物要重打）。此时改为更新标题与说明，附件随后 upload --clobber。
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在：更新说明与附件"
            gh release edit $tag --title "ADB 设备指令台 $tag" `
              --notes-file dist-notes/release-notes.md
          } else {
            gh release create $tag @assets --title "ADB 设备指令台 $tag" `
              --notes-file dist-notes/release-notes.md
          }

          # latest.json：程序内更新检查的**静态源**（走 GitHub CDN，无需认证、无限流）。
          $pkg = "ADBDeviceCommander_v${ver}_win64.zip"
          $notes = (Get-Content -Raw -Encoding UTF8 dist-notes/release-notes.md).Trim()
          $payload = [ordered]@{
            version = $ver
            notes   = $notes
            url     = "https://github.com/${{ github.repository }}/releases/tag/$tag"
            assets  = @(
              [ordered]@{
                name                 = $pkg
                browser_download_url = "https://github.com/${{ github.repository }}/releases/download/$tag/$pkg"
                size                 = (Get-Item "dist/$pkg").Length
              }
            )
          }
          # 必须按 UTF-8 无 BOM 写：客户端用 utf-8 解码，带 BOM 会让 JSON 解析失败
          $json = $payload | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("$PWD/dist/latest.json", $json,
            (New-Object System.Text.UTF8Encoding($false)))
          Get-Content dist/latest.json
          gh release upload $tag dist/latest.json --clobber

          Add-Content $env:GITHUB_STEP_SUMMARY "- Release：https://github.com/${{ github.repository }}/releases/tag/$tag"
          Add-Content $env:GITHUB_STEP_SUMMARY "- 静态版本源：https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
